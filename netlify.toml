# Netlify Configuration for CrisisLink Frontend

[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) routing
# Redirect all traffic to index.html so React Router can handle it
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
